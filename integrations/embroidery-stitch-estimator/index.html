<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TSB Stitch Estimator</title><style>body{font:16px system-ui;margin:40px auto;max-width:640px;padding:0 18px;color:#18202a}h1{color:#ea580c}form{display:grid;gap:14px}input,button{padding:12px;font:inherit}button{background:#f97316;color:white;border:0;border-radius:8px;cursor:pointer}pre{background:#f3f4f6;padding:18px;white-space:pre-wrap;border-radius:8px}</style></head><body><h1>Embroidery Stitch Estimator</h1><p>Experimental stitch count estimate from a transparent PNG. Not a digitized file.</p><form id="f"><label>PNG file <input name="file" type="file" accept="image/png" required></label><label>Finished width (inches) <input name="width_in" type="number" min=".25" max="20" step=".25" value="4" required></label><label>Stitch spacing (mm) <input name="spacing_mm" type="number" min=".25" max="1.2" step=".01" value=".42"></label><button>Estimate stitches</button></form><pre id="result" aria-live="polite">Upload a PNG to begin.</pre><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#result');out.textContent='Analyzing…';try{const r=await fetch('/api/v1/embroidery/estimate',{method:'POST',body:new FormData(e.target)});const d=await r.json();out.textContent=JSON.stringify(d,null,2)}catch(err){out.textContent=String(err)}})</script></body></html>
