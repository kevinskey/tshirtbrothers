name: Deploy StoneCut production

on:
  push:
    branches: [deploy/stonecut-production]
    paths:
      - '.github/workflows/deploy-stonecut-release.yml'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy/stonecut-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy pinned tested StoneCut release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 18m
          script: |
            sudo -n bash -s <<'STONECUT_RELEASE'
            set -euo pipefail
            python3 - <<'DOMAIN_CHECK'
            import socket,urllib.request,re,json
            for host in ['stonecut.com','rhinestones.tshirtbrothers.com']:
             try: print('DOMAIN_DNS',host,json.dumps(socket.gethostbyname_ex(host)))
             except Exception as e: print('DOMAIN_DNS_ERROR',host,str(e))
             try:
              response=urllib.request.urlopen('https://'+host+'/',timeout=12)
              html=response.read(200000).decode('utf-8','replace')
              print('DOMAIN_HTTP',host,response.status,response.url,'TITLE',re.findall(r'<title>(.*?)</title>',html,re.I)[:1],'SCRIPTS',re.findall(r'<script[^>]+src="([^"]+)"',html)[:2])
             except Exception as e: print('DOMAIN_HTTP_ERROR',host,str(e))
            DOMAIN_CHECK
            work=$(mktemp -d /var/tmp/stonecut-runner.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            git clone --quiet https://github.com/kevinskey/stonecut.git "$work/source"
            git -C "$work/source" checkout --quiet --detach 5af529a4b727751d6d6d42436a176998ec1188da
            STONECUT_REF=5af529a4b727751d6d6d42436a176998ec1188da bash "$work/source/deploy.sh"
            STONECUT_RELEASE
