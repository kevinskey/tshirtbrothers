    <!-- Microsoft Clarity — free heatmaps + session recordings.
         Project ID: wwufy30yoe (TShirt Brothers). Dashboard:
         https://clarity.microsoft.com/projects
         Deferred to after window 'load' (with a requestIdleCallback
         shim) so the ~71ms forced reflow Clarity does on init doesn't
         compete with LCP/FCP. Anything calling clarity() before the
         script lands queues into c[a].q and replays when it boots. -->
    <script>
      (function(c,l,a,r,i){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        var load=function(){
          var t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;
          var y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        };
        var schedule=function(){
          if (c.requestIdleCallback) c.requestIdleCallback(load,{timeout:3000});
          else setTimeout(load,1500);
        };
        if (l.readyState==='complete') schedule();
        else c.addEventListener('load',schedule,{once:true});
      })(window, document, 'clarity', 'script', 'wwufy30yoe');
    </script>

    <!-- SEO meta tags.
         NOTE FOR EDITORS: never write literal tag syntax in the comments
         in this file. The sister-brand shell generators in
         client/scripts/make-*-shell.mjs rewrite this head with regexes
         (they swap the title, the structured data, the noscript block);
         a tag name in angle brackets inside a comment gets matched as if
         it were real markup, which silently eats the comment and the tag
         that follows it. Describe tags by name instead.
         WHAT CHANGED (2026-10-23): the canonical link, meta description
         and the Open Graph / Twitter blocks used to be hard-coded here.
         Every public page already renders the Seo component
         (react-helmet-async), which emits its own per-route copy of
         those tags, and Helmet cannot remove static ones it finds in
         this shell. So every one of the 68 prerendered pages shipped two
         canonical links (the second correct, the first always pointing
         at the homepage), two meta descriptions, and two of every og and
         twitter tag. Conflicting canonicals are worse than none: Google
         may discard both signals, and answer engines get an ambiguous
         page identity. They are deliberately NOT re-added here — the Seo
         component owns them. Only the title element stays, as a
         pre-hydration fallback, because Helmet genuinely replaces the
         single title element rather than appending to it. -->
    <title>TShirt Brothers | Custom Apparel, Printing &amp; Embroidery Serving South Atlanta</title>
    <meta name="author" content="TShirt Brothers" />

    <!-- Structured data.
         Emitted as an @graph of three linked nodes (Organization,
         WebSite, LocalBusiness) rather than a bare LocalBusiness.
         Why the @id values matter: the homepage renders a SECOND
         LocalBusiness node from the GoogleReviews component, carrying
         the live aggregateRating from the Google Places API. Without a
         shared @id, consumers see two unrelated businesses with the
         same name and may trust neither — the ratings end up orphaned
         from the business they describe. Both nodes now use
         "https://tshirtbrothers.com/#business" so they merge into one
         entity.
         Nothing here is fabricated: no aggregateRating, no review
         counts, and no second storefront. The only physical location is
         the Fairburn shop. -->

      "@graph": [

    },

      "url": "https://tshirtbrothers.com",
      "name": "TShirt Brothers",
      "publisher": { "@id": "https://tshirtbrothers.com/#organization" },
      "inLanguage": "en-US",
      "potentialAction": {

    },
    {
      "@type": "LocalBusiness",
      "@id": "https://tshirtbrothers.com/#business",
      "parentOrganization": { "@id": "https://tshirtbrothers.com/#organization" },
      "name": "TShirt Brothers",

      "url": "https://tshirtbrothers.com",
      "telephone": "+14706221392",
      "email": "info@tshirtbrothers.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "6010 Renaissance Parkway",
        "addressLocality": "Fairburn",
        "addressRegion": "GA",
        "postalCode": "30213",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 33.5668,
        "longitude": -84.5808
      },

      "areaServed": [
        {"@type": "City", "name": "Tyrone", "containedInPlace": {"@type": "State", "name": "Georgia"}},
        {"@type": "City", "name": "Fairburn", "containedInPlace": {"@type": "State", "name": "Georgia"}},

    <!-- Fonts — load the Google Fonts stylesheet non-blocking via the
         rel=preload + onload swap pattern so it doesn't sit on the
         critical path delaying LCP. font-display=swap means the page
         renders with system fallbacks immediately and re-renders when
         the web fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>

        rel="stylesheet"

    <!-- SEO: static fallback for crawlers that can't run JavaScript.
         This block is baked into all 68 prerendered pages, so its
         heading was previously a second top-level heading on EVERY page
         — competing with each page's real one ("Custom Church Shirts",
         etc.) and describing the whole business instead of the page. A
         page with two contradictory h1 elements gives search and AI
         systems no clear topic. Demoted to a bold paragraph: the
         fallback copy is preserved for no-JS crawlers, but each page now
         has exactly one h1. Keep this block heading-free. -->
    <noscript>
