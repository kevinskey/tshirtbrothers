# Live Hard Truth on the TSB subdomain (livehardtruth.tshirtbrothers.com).
#
# This is the INTERIM home for the LHT storefront until livehardtruth.com
# itself is repointed off Lovable (see livehardtruth.com.conf). Same docroot,
# same API backend, same LHT shell — only the hostname differs.
#
# There is NO wildcard DNS and NO wildcard certificate on *.tshirtbrothers.com,
# despite the comment in client/src/lib/storeSubdomain.ts claiming otherwise
# (verified 2026-10-23: shop.tshirtbrothers.com has its own single-name cert).
# Every store subdomain must be provisioned by hand.
#
# NOT applied automatically. Bring-up order:
#   1. DNS: A record `livehardtruth` -> 198.211.113.144.
#      tshirtbrothers.com is on WORDPRESS.COM nameservers (ns1/2/3.wordpress.com),
#      NOT name.com and NOT DigitalOcean — add it in the WordPress.com
#      dashboard under Domains -> tshirtbrothers.com -> DNS records.
#      Wait for `dig +short livehardtruth.tshirtbrothers.com` to answer.
#   2. scp this file to /etc/nginx/sites-enabled/livehardtruth.tshirtbrothers.com
#      (a regular file, not a symlink) with ONLY the port-80 block at the
#      bottom — certbot needs port 80 answering before it can validate.
#   3. certbot --nginx -d livehardtruth.tshirtbrothers.com
#   4. Reconcile with this file; nginx -t && systemctl reload nginx
#
# Requires the client build that lists this host in VITE_LHT_HOSTS /
# DEFAULT_HOSTS (client/src/lht/lib/brand.ts). index-lht.html is only a
# metadata transform of index.html — it loads the same bundle, so without
# that host list the page still boots the generic TSB/group-store app.
#
# Note: index-lht.html's canonical and og:url point at livehardtruth.com by
# design. That is correct — the subdomain is interim and should not compete
# with the real domain in search results.
#
# Gotchas inherited from the TSB vhost (see deploy/nginx/README.md):
#   - add_header does NOT merge across blocks — the security headers are
#     re-declared inside `location /`.
#   - HTML must be no-store: each deploy's vite build rotates hashed asset
#     names and a cached shell white-screens the site.
#   - No literal external hostnames in proxy_pass (the 2026-09-14 outage).

server {
    server_name livehardtruth.tshirtbrothers.com;
    client_max_body_size 250M;

    root /var/www/tshirtbrothers/client/dist;
    index index-lht.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Defense in depth: never serve .git/ even if the repo ends up under the docroot.
    location ~ /\.git { deny all; return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # Never let a browser hold onto the HTML shell (see TSB vhost note).
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # add_header does not merge: these six are copied from the server
        # block so HTML responses keep their security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # The LHT SPA shell — NOT index.html (that's TSB's, prerendered).
        try_files $uri /index-lht.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/livehardtruth.tshirtbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livehardtruth.tshirtbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name livehardtruth.tshirtbrothers.com;
    return 301 https://$host$request_uri;
}
