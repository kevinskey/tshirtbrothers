# All Print Club (allprintclub.com) — sister-brand vhost. Same docroot and
# API backend as tshirtbrothers.com, but serves the APC-branded shell
# dist/index-apc.html (generated at build time by scripts/make-apc-shell.mjs)
# instead of dist/index.html.
#
# NOT applied automatically. Per deploy/nginx/README.md: start from the HTTP
# block below, get the LE cert, and hand-apply to /etc/nginx/sites-enabled/
# (a regular file, not a symlink). Bring-up order:
#   1. DNS: A records for allprintclub.com + www -> 198.211.113.144
#      (domain DNS is on WordPress.com nameservers, like the other brands)
#   2. scp this file to /etc/nginx/sites-enabled/allprintclub.com (initially
#      only the port-80 block below with the location blocks pasted in;
#      certbot needs port 80 answering first)
#   3. certbot --nginx -d allprintclub.com -d www.allprintclub.com
#   4. Reconcile with this file; nginx -t && systemctl reload nginx
#   5. Add APC_DOMAIN=https://allprintclub.com to server/.env + pm2 restart
#
# Gotchas inherited from the TSB vhost (see deploy/nginx/README.md):
#   - add_header does NOT merge across blocks — the security headers are
#     re-declared inside `location /`.
#   - HTML must be no-store: each deploy's vite build rotates hashed asset
#     names and a cached shell white-screens the site.
#   - No literal external hostnames in proxy_pass (the 2026-09-14 outage).

server {
    server_name allprintclub.com www.allprintclub.com;
    client_max_body_size 250M;

    root /var/www/tshirtbrothers/client/dist;
    index index-apc.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Defense in depth: never serve .git/ even if the repo ends up under the docroot.
    location ~ /\.git { deny all; return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # Never let a browser hold onto the HTML shell (see TSB vhost note).
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # add_header does not merge: these six are copied from the server
        # block so HTML responses keep their security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # The APC SPA shell — NOT index.html (that's TSB's, prerendered).
        try_files $uri /index-apc.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/allprintclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allprintclub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name allprintclub.com www.allprintclub.com;
    return 301 https://$host$request_uri;
}
