# Bootstrap vhost for livehardtruth.tshirtbrothers.com — port 80 ONLY.
#
# The full vhost (livehardtruth.tshirtbrothers.com.conf) names cert files
# under /etc/letsencrypt/live/livehardtruth.tshirtbrothers.com/ that do not
# exist until certbot has run, and nginx refuses to start when ssl_certificate
# points at a missing file. So install THIS first, let certbot validate over
# port 80, then replace it with the full file.
#
# Prerequisite: the A record `livehardtruth` -> 198.211.113.144 must already
# resolve (DNS is on WordPress.com nameservers).
#
#   scp deploy/nginx/livehardtruth.tshirtbrothers.com.bootstrap.conf \
#       root@198.211.113.144:/etc/nginx/sites-enabled/livehardtruth.tshirtbrothers.com
#   ssh root@198.211.113.144 'nginx -t && systemctl reload nginx'
#   ssh root@198.211.113.144 'certbot --nginx -d livehardtruth.tshirtbrothers.com'
#   scp deploy/nginx/livehardtruth.tshirtbrothers.com.conf \
#       root@198.211.113.144:/etc/nginx/sites-enabled/livehardtruth.tshirtbrothers.com
#   ssh root@198.211.113.144 'nginx -t && systemctl reload nginx'

server {
    listen 80;
    server_name livehardtruth.tshirtbrothers.com;

    root /var/www/tshirtbrothers/client/dist;
    index index-lht.html;

    # certbot writes its HTTP-01 challenge here; it must be reachable
    # before the catch-all location below.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index-lht.html;
    }
}
