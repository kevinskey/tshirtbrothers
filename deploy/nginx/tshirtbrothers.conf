server {
    server_name tshirtbrothers.com www.tshirtbrothers.com 198.211.113.144;
    client_max_body_size 250M;

    root /var/www/tshirtbrothers/client/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Defense in depth: never serve .git/ even if the repo ends up under the docroot.
    location ~ /\.git { deny all; return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    location = /stats-script.js {
        proxy_pass http://127.0.0.1:3070/script.js;
        proxy_set_header Host $host;
    }

    location = /api/send {
        proxy_pass http://127.0.0.1:3070/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Never let a browser hold onto index.html. Each deploy runs
        # `vite build`, which empties client/dist and emits new hashed
        # filenames -- so a cached index.html asks for an
        # /assets/index-<oldhash>.js that no longer exists, 404s, and
        # white-screens the site until a hard reload. The hashed assets
        # themselves stay cached for 30d by the regex location above.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # nginx add_header does not merge: declaring one here discards every
        # add_header inherited from the server block. These six are copied
        # from the server block so HTML responses keep their security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # try the file, then a directory-index file directly (avoids the
        # 301 redirect that nginx would otherwise issue for missing
        # trailing slashes on the prerendered routes), then the SPA shell.
        try_files $uri $uri/index.html /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tshirtbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tshirtbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS for domain
server {
    listen 80;
    server_name tshirtbrothers.com www.tshirtbrothers.com;
    return 301 https://$host$request_uri;
}

# Serve site on the new IP via HTTP (defense for direct-IP probes)
server {
    listen 80;
    server_name 198.211.113.144;

    root /var/www/tshirtbrothers/client/dist;
    index index.html;

    location ~ /\.git { deny all; return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
