server {
    server_name tshirtbrothers.com www.tshirtbrothers.com 198.211.113.144;
    client_max_body_size 320M;

    root /var/www/tshirtbrothers/client/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy — REPORT-ONLY to begin with.
    #
    # This site had no CSP at all; the other five headers were already here.
    # It cannot just be switched on: the built index.html carries inline
    # <script> and <style>, and Google Tag Manager plus Microsoft Clarity
    # both inject inline script. Enforcing a guessed policy would break the
    # Design Studio or checkout; enforcing one with 'unsafe-inline' on
    # script-src would buy almost nothing.
    #
    # Origins below were measured from the built HTML, not assumed:
    # ssactivewear + sanmar (catalog images), DO Spaces (our CDN),
    # Google Fonts, Clarity, GTM, googleusercontent (review avatars),
    # Stripe (checkout), replicate.delivery + cloudinary (studio art).
    #
    # Violations post to /api/csp-report, which logs a deduped line per
    # directive. When that goes quiet for a week, drop "-Report-Only" from
    # the header name to enforce.
    set $tsb_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://scripts.clarity.ms https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://tshirtbrothers.atl1.cdn.digitaloceanspaces.com; connect-src 'self' https://api.stripe.com https://www.ssactivewear.com https://cdnm.sanmar.com https://tshirtbrothers.atl1.cdn.digitaloceanspaces.com https://res.cloudinary.com https://replicate.delivery https://api.iconify.design https://www.clarity.ms https://*.clarity.ms https://www.google-analytics.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://www.google.com; worker-src 'self' blob:; report-uri /api/csp-report";
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $tsb_csp always;

    # Defense in depth: never serve .git/ even if the repo ends up under the docroot.
    location ~ /\.git { deny all; return 404; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    location = /stats-script.js {
        proxy_pass http://127.0.0.1:3070/script.js;
        proxy_set_header Host $host;
    }

    location = /api/send {
        proxy_pass http://127.0.0.1:3070/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: there is no `location /stores/` block, and does not need to be.
    # One existed here but was never applied to the live config. It is now
    # redundant: `location /` falls through to @spa, so a store slug with no
    # prerendered file reaches Express and storeOgHandler rewrites the head,
    # while a prerendered store page already carries its own Helmet tags.
    # Verified on /stores/sensory-seasons -> og:title "Sensory Seasons · Shop".

    location / {
        # Never let a browser hold onto index.html. Each deploy runs
        # `vite build`, which empties client/dist and emits new hashed
        # filenames -- so a cached index.html asks for an
        # /assets/index-<oldhash>.js that no longer exists, 404s, and
        # white-screens the site until a hard reload. The hashed assets
        # themselves stay cached for 30d by the regex location above.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # nginx add_header does not merge: declaring one here discards every
        # add_header inherited from the server block. These six are copied
        # from the server block so HTML responses keep their security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $tsb_csp always;

        # try the file, then a directory-index file directly (avoids the
        # 301 redirect that nginx would otherwise issue for missing
        # trailing slashes on the prerendered routes), then hand off to the
        # app.
        #
        # This used to end `/index.html`, which meant ANY unmatched path
        # returned 200 and the prerendered homepage -- canonical tag included.
        # /wp-admin, /occasions/graduation and /shop/product/1002523 were all
        # 200 with the same 268,118 bytes: an unbounded set of duplicate
        # homepages for Google to crawl. A plain `=404` is not the fix either,
        # because most routes are dynamic (/invoice/view/:id, /mockup/:token)
        # and have no file on disk. Express knows the route table, so it
        # decides: SPA shell at 200 for a real route, dist/404.html at 404
        # with noindex for anything else.
        try_files $uri $uri/index.html @spa;
    }

    # Fallback target for location / above. Only reached when nginx found
    # nothing on disk, so prerendered pages never pay for this hop.
    location @spa {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # add_header does not merge, and a proxied response starts from the
        # server block again -- so the same six security headers plus the
        # no-store policy have to be restated here, exactly as in location /.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $tsb_csp always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tshirtbrothers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tshirtbrothers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS for domain
server {
    listen 80;
    server_name tshirtbrothers.com www.tshirtbrothers.com;
    return 301 https://$host$request_uri;
}

# Serve site on the new IP via HTTP (defense for direct-IP probes)
server {
    listen 80;
    server_name 198.211.113.144;

    root /var/www/tshirtbrothers/client/dist;
    index index.html;

    location ~ /\.git { deny all; return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
